<svg xmlns="http://www.w3.org/2000/svg" width="520" height="64" viewBox="0 0 520 64" role="img" aria-label="Animated known issue alert">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b0000"/>
      <stop offset="100%" stop-color="#ff1a1a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="516" height="60" rx="12" fill="#280000" stroke="#ff5f5f" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="516" height="60" rx="12" fill="url(#bg)" opacity="0.23"/>

  <text x="22" y="42" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" filter="url(#glow)">
    !!
    <animate attributeName="opacity" values="1;0.2;1" dur="0.85s" repeatCount="indefinite"/>
  </text>

  <text x="86" y="41" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">
    KNOWN ISSUE
  </text>
</svg>
